name: Construire l'APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KS_PASS: ${{ secrets.KEYSTORE_PASSWORD || 'pehe-fenua-2026' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Installer Capacitor
        run: npm install

      - name: Créer le projet Android
        run: npx cap add android

      - name: Icônes de l'app
        run: npx @capacitor/assets generate --android --assetPath assets || echo "Icônes ignorées"

      - name: Module musique, permissions et version
        run: python3 scripts/patch_android.py ${{ github.run_number }}

      - name: Copier l'app dans Android
        run: npx cap sync android

      - name: Compiler
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon

      - name: Signer l'APK
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/zipalign -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          $BT/apksigner sign --ks pehe.keystore --ks-key-alias pehe --ks-pass env:KS_PASS --key-pass env:KS_PASS --out Pehe.apk aligned.apk
          $BT/apksigner verify Pehe.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Pehe-apk
          path: Pehe.apk

      - name: Publier dans les Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Pehe 1.0.${{ github.run_number }}
          files: Pehe.apk
